[project]
name = "grailseeker-backend"
version = "0.1.0"
description = "GrailSeeker API — visual search for second-hand clothing"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.6",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.18",
    "Pillow>=11.0.0",
    "open-clip-torch>=2.29.0",
    "ultralytics>=8.3.0",
    # playwright removed — eBay Browse API replaces scraping
    "APScheduler>=3.10.0",
    "httpx>=0.28.0",
    "PyJWT[crypto]>=2.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
