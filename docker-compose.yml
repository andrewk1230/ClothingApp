services:
  db:
    image: pgvector/pgvector:pg16
    container_name: grailseeker-db
    environment:
      POSTGRES_USER: grailseeker
      # Default is for local dev only. On the serving host set POSTGRES_PASSWORD
      # to a strong value (and match it in DATABASE_URL) BEFORE first `up` —
      # postgres only applies it when initializing an empty data volume.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grailseeker}
      POSTGRES_DB: grailseeker
    ports:
      # Loopback only: nothing but the local backend should reach Postgres.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grailseeker"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
